<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>파이널 유도</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f9fb;
        color: #102a43;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #516170;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>파이널 유도</h1>
      <p>iOS 앱 빌드 전 운영 HTTPS 주소를 FINAL_JUDO_IOS_SERVER_URL로 설정한 뒤 Capacitor sync/build를 실행하세요.</p>
    </main>
  </body>
</html>
