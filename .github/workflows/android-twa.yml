name: Android TWA Package

on:
  workflow_dispatch:
    inputs:
      production_origin:
        description: "Real HTTPS production origin, not localhost, .example, or TODO"
        required: true
        type: string
      release_sha256:
        description: "Release signing certificate SHA-256 fingerprint"
        required: true
        type: string
      build_artifacts:
        description: "Run Bubblewrap build after prepare"
        default: false
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  android-twa:
    name: Prepare Android TWA package
    runs-on: ubuntu-latest
    env:
      ANDROID_TWA_ORIGIN: ${{ inputs.production_origin }}
      ANDROID_TWA_SHA256: ${{ inputs.release_sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Verify mobile and Android packaging contracts
        run: |
          npm run test:mobile-install
          npm run test:android-packaging

      - name: Prepare Android SDK tools
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android TWA doctor
        run: |
          mkdir -p .data
          npm run android:twa:doctor -- \
            --strict \
            --origin="$ANDROID_TWA_ORIGIN" \
            --sha256="$ANDROID_TWA_SHA256" \
            --out=.data/android-twa-doctor.json

      - name: Generate TWA inputs
        run: |
          npm run android:twa:prepare -- \
            --origin="$ANDROID_TWA_ORIGIN" \
            --sha256="$ANDROID_TWA_SHA256" \
            --out-dir=mobile/android/generated

      - name: Build APK/AAB with Bubblewrap
        if: ${{ inputs.build_artifacts == true }}
        run: |
          npm run android:twa:build -- \
            --origin="$ANDROID_TWA_ORIGIN" \
            --sha256="$ANDROID_TWA_SHA256"

      - name: Upload Android package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: final-judo-android-twa
          if-no-files-found: warn
          path: |
            .data/android-twa-doctor.json
            mobile/android/generated/**
            mobile/android/twa/**/*.apk
            mobile/android/twa/**/*.aab
